name: gates

# The repo's claim is that its evidence standards are enforced by tooling rather than
# trust. This is where that becomes true for every clone, not just the author's machine.
#
# Deliberately excluded: the lessons themselves. They need model credentials, a running
# LiteLLM proxy and AWS access, and several spend money. tools/ship_gate.py is likewise
# a manual release step. What runs here is everything that can be checked for free and
# deterministically.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan below reads every commit, not just the tip.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      # Both gates ship in the agent-build-gates workspace package and are invoked
      # through its console scripts, the same way an external consumer would.

      # Account ids, SSO profile strings and account-bearing ARNs must never reach a
      # tracked file. This is the one gate that was already enforced locally.
      # NUL-delimited through xargs rather than an unquoted `$(git ls-files ...)`.
      # actionlint's shellcheck pass flags the unquoted form (SC2046), and a control
      # confirmed it is a real break rather than a style note: a tracked file named
      # `has space.py` makes the unquoted version crash with
      # `FileNotFoundError: 'space.py'`. Both repos have zero such filenames today, so
      # this was latent, not live.
      - name: No AWS account identifiers in tracked files
        run: git ls-files -z '*.md' '*.py' | xargs -0 uv run check-no-aws-ids

      # Paths are passed explicitly. Pointing this at "." would sweep .venv, which is
      # pinned as a known limitation in the package's test suite.
      - name: No substituted integrations
        run: git ls-files -z '*.py' | xargs -0 uv run no-sim-check

      # No local machine paths (home directories, ~/Code, /Volumes, macOS per-user temp)
      # in any tracked file. The pre-commit hook runs the same script on staged files.
      - name: No local machine paths in tracked files
        run: git ls-files -z | xargs -0 sh tools/check_no_local_paths.sh

      # Secrets across the whole history, with the repo's .gitleaks.toml (default rules
      # plus one narrow allowlist). The binary is pinned to a release and its SHA-256,
      # recorded 2026-09-28 from the release's checksums file and matched against a
      # direct download, so a changed artifact fails here instead of running.
      - name: No secrets in history (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

      # A1. Observations carry an id, a lifecycle status and a resolvable supersedes link,
      # so a rule, a reflection and a test can all cite the same entry. Ids must also stay
      # in increasing order, which is what makes "append-only" checkable rather than
      # asserted. Everything that reads the log back depends on this holding.
      - name: Observations carry an id and a lifecycle
        run: uv run python tools/check_obs_schema.py

      # A2. CLAUDE.md's rule section is a view of the promoted observations, not a file
      # that gets rewritten whole. This fails on a hand edit inside the generated block,
      # which is the update pattern that loses the detail and the incident behind a rule.
      - name: CLAUDE.md matches what the store renders
        run: uv run python tools/render_claude_md.py --check

      # A6. The one step in the loop that used to run on judgement alone. A promoted or
      # parked rule names the run or the incident that decided it, and the reference has
      # to resolve.
      - name: Promotions cite the evidence that decided them
        run: uv run python tools/check_promotions.py

      - name: Tests
        run: uv run pytest -q

      # The workflows are code and were not being checked. actionlint validates them
      # against the real GitHub Actions schema and runs shellcheck over every `run`
      # block, which is what caught the SC2046 above. Parsing the file as YAML proves
      # only that it is YAML.
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Split from `gates` on purpose. This job needs Node and a headless browser, which
    # is a heavier failure surface than the rest of the suite, so a flake here stays
    # legible as a flake here rather than turning the evidence gates red.
    #
    # Added after the first time anything actually rendered these: 110 tracked markdown
    # files carry diagrams, 5 of them did not parse and rendered as an error box for
    # readers, and 225 labels used `\n`, which mermaid prints literally rather than
    # treating as a line break. Both classes were invisible without this job.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11

      # mmdc drives Chromium through puppeteer and takes its settings as a FILE
      # (-p/--puppeteerConfigFile), not an environment variable. GitHub runners cannot
      # use the Chromium sandbox, so it is disabled here and only here: this container
      # renders repository markdown already in the tree, nothing user-supplied.
      - name: Configure puppeteer for the runner
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          echo "PUPPETEER_CONFIG=$RUNNER_TEMP/puppeteer.json" >> "$GITHUB_ENV"

      - name: Render every mermaid diagram
        run: sh tools/check_mermaid.sh
