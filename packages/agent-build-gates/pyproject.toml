[project]
name = "agent-build-gates"
version = "0.1.0"
description = "Quality gates for agent-built code: an anti-simulation tripwire, an AWS-account tripwire, and an eval harness with confidence intervals and significance testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "code-quality", "evals", "static-analysis", "aws"]

# Deliberately empty. The three core gates are pure standard library, which is the
# main reason to install this rather than vendor it.
dependencies = []

[project.optional-dependencies]
# ship_gate drives real agent runs, so it needs a framework and it costs money.
strands = ["strands-agents>=1.48"]

[project.scripts]
no-sim-check = "agent_build_gates.no_sim_check:cli"
check-no-aws-ids = "agent_build_gates.check_no_aws_ids:cli"
# Requires the [strands] extra. Without it this exits with an install hint.
ship-gate = "agent_build_gates.ship_gate:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_build_gates"]
