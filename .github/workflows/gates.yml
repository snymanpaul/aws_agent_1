name: gates

# The repo's claim is that its evidence standards are enforced by tooling rather than
# trust. This is where that becomes true for every clone, not just the author's machine.
#
# Deliberately excluded: the lessons themselves. They need model credentials, a running
# LiteLLM proxy and AWS access, and several spend money. tools/ship_gate.py is likewise
# a manual release step. What runs here is everything that can be checked for free and
# deterministically.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      # Account ids, SSO profile strings and account-bearing ARNs must never reach a
      # tracked file. This is the one gate that was already enforced locally.
      - name: No AWS account identifiers in tracked files
        run: uv run python tools/check_no_aws_ids.py $(git ls-files '*.md' '*.py')

      # Paths are passed explicitly. Pointing this at "." would sweep .venv, which is
      # pinned as a known limitation in tests/test_no_sim_check.py.
      - name: No substituted integrations
        run: uv run python tools/no_sim_check.py $(git ls-files '*.py')

      - name: Tests
        run: uv run pytest -q
